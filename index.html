<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTC Feedstock Tool</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">

  <h1>HTC Feedstock Comparison Tool</h1>

  <div class="card">
    <h2>Inputs</h2>

    <label>Moisture Content (%) (Typical: 60–80%)</label>
    <input type="number" id="moistureContent" value="70">

    <label>HTC Temperature (°C) (Typical: 180–250)</label>
    <input type="number" id="temperature" value="220">

    <label>Residence Time (min) (Typical: 30–120)</label>
    <input type="number" id="residenceTime" value="60">

    <label>Optimization Goal</label>
    <select id="optimizationGoal">
      <option value="energy">Max Energy</option>
      <option value="balanced">Balanced</option>
      <option value="carbon">Max Carbon</option>
    </select>

    <button onclick="compare()">Run Analysis</button>
  </div>

  <div class="card">
    <h2>Results</h2>
    <div id="results"></div>

    <h3>Comparison Graph</h3>
    <canvas id="chartCanvas"></canvas>

    <button onclick="downloadPNG()">Download Graph</button>
    <button onclick="downloadCSV()">Download CSV</button>
    <button onclick="downloadPDF()">Download PDF</button>
  </div>

</div>

<!-- LIBRARIES (IMPORTANT ORDER) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script src="app.js"></script>

</body>
</html>
