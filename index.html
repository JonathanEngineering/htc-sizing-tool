<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTC Biomass Sizing Tool</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>HTC Biomass Sizing Tool</h1>
      <p>
        Screening-level estimator for land use, biomass demand, and HTC system footprint.
      </p>
    </header>

    <section class="card">
      <h2>Inputs</h2>

      <label for="powerOutput">Desired Power Output (MW)</label>
      <input type="number" id="powerOutput" min="0.1" step="0.1" placeholder="Enter power in MW" />

      <label for="optimizationLevel">Optimization Level</label>
      <select id="optimizationLevel">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>

      <label for="moistureContent">Moisture Content (%)</label>
      <input type="number" id="moistureContent" min="0" max="60" step="1" value="20" />

      <button id="runBtn">Generate Recommendations</button>
    </section>

    <section class="card">
      <h2>Results</h2>
      <div id="results">
        <p>Enter inputs and generate scenarios.</p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
