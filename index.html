<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTC Feedstock Comparison Tool</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>HTC Feedstock Comparison Tool</h1>
      <p>
        Screening-level comparison of biomass feedstocks for hydrothermal carbonization (HTC),
        with emphasis on usable energy and carbon retention.
      </p>
    </header>

    <section class="card">
      <h2>Inputs</h2>

      <label for="moistureContent">Moisture Content (%)</label>
      <input type="number" id="moistureContent" min="0" max="90" step="1" value="20" />

      <label for="temperature">HTC Temperature (°C)</label>
      <input type="number" id="temperature" min="180" max="280" step="1" value="220" />

      <label for="residenceTime">Residence Time (min)</label>
      <input type="number" id="residenceTime" min="5" max="240" step="5" value="60" />

      <label for="optimizationGoal">Optimization Goal</label>
      <select id="optimizationGoal">
        <option value="energy" selected>Max usable energy</option>
        <option value="balanced">Balanced</option>
        <option value="carbon">Max carbon retention</option>
      </select>

      <button id="runBtn">Compare Feedstocks</button>
    </section>

    <section class="card">
      <h2>Results</h2>
      <div id="results">
        <h3>Feedstock Comparison</h3>
        <canvas id="comparisonChart"></canvas>
        <button onclick="downloadChart()">Download Graph (PNG)</button>
        <button onclick="downloadCSV()">Download Data (CSV)</button>
        <button onclick="downloadPDF()">Download Report (PDF)</button>
        <p>Enter the HTC conditions and click “Compare Feedstocks.”</p>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf"></script>
  <script src="app.js"></script>
</body>
</html>
